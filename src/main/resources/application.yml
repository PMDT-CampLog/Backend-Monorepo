spring:
  application:
    name: camplog-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/camplog}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: 3333

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  jwt:
    secret: ${JWT_SECRET_KEY:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3ItY2FtcGxvZy1qd3Qtc2lnbmluZy1wcm9k}
    expiration: 86400000 # 24 horas em milissegundos
  email:
    provider: resend # resend ou mock
    api-key: ${EMAIL_SERVICE_API_KEY:mock-key}
    from: "CampLog <no-reply@camplog.com>"
  data-platform:
    webhook-url: ${DATA_PLATFORM_WEBHOOK_URL:http://localhost:8000/api/v1/events/user-created}
    secret-token: ${DATA_PLATFORM_SECRET:camp-log-data-sec-123}
  media:
    storage-mode: ${MEDIA_STORAGE_MODE:local}  # local ou s3
    s3-bucket: ${MEDIA_S3_BUCKET:camplog-dev-user-media}
    s3-region: ${MEDIA_S3_REGION:us-east-1}
    cdn-base-url: ${MEDIA_CDN_URL:http://localhost:3333/media}
    local-upload-dir: ${MEDIA_LOCAL_DIR:./uploads}
    max-avatar-size: 2097152      # 2 MB
    max-cover-size: 5242880       # 5 MB
    max-post-image-size: 10485760 # 10 MB

logging:
  level:
    org.springframework.security: INFO
    com.camplog: DEBUG
