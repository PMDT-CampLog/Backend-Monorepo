# ==============================================================================
# CampLog Backend - Pipeline de Produção (AWS Serverless)
# Disparado a cada criação de tag (ex: v1.0.0)
# ==============================================================================

when:
  event: tag
  tag: v*

steps:
  # --- 1. GIT (Verificar status e logs) ---
  git-info:
    image: alpine/git
    commands:
      - echo "=== [GIT INFO] Verificando sincronização com o GitHub para Produção ==="
      - git status
      - git log -1 --oneline

  # --- 2. INSTALL (Instalar/baixar dependências em cache) ---
  install-deps:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [INSTALL] Baixando dependências do Maven ==="
      - mvn dependency:go-offline -B

  # --- 3. LINT (Análise estática / compilação básica) ---
  lint-check:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [LINT] Executando validação de compilação de Produção ==="
      - mvn clean compile -B

  # --- 4. TESTS (Executar testes automatizados) ---
  test-run:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [TESTS] Executando testes de Produção ==="
      - mvn test -B

  # --- 5. GET CREDENTIALS ENV (Validar acesso AWS) ---
  get-credentials-env:
    image: amazon/aws-cli:latest
    commands:
      - echo "=== [GET CREDENTIALS ENV] Validando chaves secretas e conexão AWS ==="
      - aws sts get-caller-identity
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_DEFAULT_REGION: us-east-1

  # --- 6. BUILD & PUSH TO AMAZON ECR (Docker Buildx Plugin) ---
  build-and-push-ecr:
    image: woodpeckerci/plugin-docker-buildx:latest
    privileged: true
    settings:
      # O plugin realiza o login no ECR de forma automática usando as credenciais passadas
      registry: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com
      repo: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/camplog-backend
      dockerfile: ./Dockerfile
      context: .
      tags:
        - latest
        - ${CI_COMMIT_TAG}  # Tag gerada no Git (ex: v1.0.0)
      aws_access_key_id:
        from_secret: aws_access_key_id
      aws_secret_access_key:
        from_secret: aws_secret_access_key
      aws_region: us-east-1
    environment:
      AWS_ACCOUNT_ID:
        from_secret: aws_account_id

  # --- 7. DEPLOY AWS APPRUNNER / ECS (Zero Downtime Update) ---
  deploy-production:
    image: amazon/aws-cli:latest
    commands:
      - echo "=== [DEPLOY] Atualizando serviço Backend no AWS App Runner / ECS em Produção ==="
      # 7a. Caso esteja utilizando o AWS App Runner (Deploy manual via CLI):
      - aws apprunner start-deployment --service-arn $${AWS_APP_RUNNER_SERVICE_ARN} --region us-east-1
      
      # 7b. Caso prefira utilizar o AWS ECS Fargate (Descomente se aplicável):
      # - aws ecs update-service --cluster camplog-prod-cluster --service camplog-backend-service --force-new-deployment --region us-east-1
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_DEFAULT_REGION: us-east-1
      AWS_APP_RUNNER_SERVICE_ARN:
        from_secret: aws_app_runner_service_arn
