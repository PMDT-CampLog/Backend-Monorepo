# ==============================================================================
# CampLog Backend - Pipeline de Produção (AWS Serverless)
# Disparado a cada criação de tag (ex: v1.0.0)
# ==============================================================================

when:
  event: tag
  tag: v*

steps:
  # --- 1. GIT (Verificar status e logs) ---
  git-info:
    image: alpine/git
    commands:
      - echo "=== [GIT INFO] Verificando sincronização com o GitHub para Produção ==="
      - git status
      - git log -1 --oneline

  # --- 2. INSTALL (Instalar/baixar dependências em cache) ---
  install-deps:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [INSTALL] Baixando dependências do Maven ==="
      - mvn dependency:go-offline -B

  # --- 3. LINT (Análise estática / compilação básica) ---
  lint-check:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [LINT] Executando validação de compilação de Produção ==="
      - mvn clean compile -B

  # --- 4. TESTS (Executar testes automatizados) ---
  test-run:
    image: maven:3.9.5-eclipse-temurin-17-alpine
    commands:
      - echo "=== [TESTS] Executando testes de Produção ==="
      - mvn test -B

  # --- 5. GET CREDENTIALS ENV (Validar acesso AWS - MOCK / PLACEHOLDER) ---
  get-credentials-env-placeholder:
    image: alpine:latest
    commands:
      - echo "=== [GET CREDENTIALS ENV] Verificação de credenciais AWS (Ignorado: Ambiente de Produção AWS ainda não ativo) ==="
      - echo "Evento de tag ${CI_COMMIT_TAG} recebido com sucesso."

  # --- 6. BUILD & PUSH TO AMAZON ECR (Docker Buildx Plugin - MOCK / PLACEHOLDER) ---
  build-and-push-ecr-placeholder:
    image: alpine:latest
    commands:
      - echo "=== [BUILD & PUSH] Gerando imagem Docker para o backend e enviando ao ECR ==="
      - echo "[PLACEHOLDER] Imagem camplog-backend:${CI_COMMIT_TAG} seria enviada para o ECR da AWS."

  # --- 7. DEPLOY AWS APPRUNNER / ECS (Zero Downtime Update - MOCK / PLACEHOLDER) ---
  deploy-production-placeholder:
    image: alpine:latest
    commands:
      - echo "=== [DEPLOY] Atualizando serviço Backend no AWS App Runner / ECS em Produção ==="
      - echo "[PLACEHOLDER] Evento de deploy disparado para o serviço do App Runner com a tag ${CI_COMMIT_TAG}."

